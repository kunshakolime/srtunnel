[WebService]
IdleTimeout=0
# Trust nginx's scheme header: browser reaches cockpit as https:// via the
# TLS front, but cockpit itself only sees plain http:// from localhost.
# Without this, cockpit 403s wss upgrades carrying an https:// Origin.
ProtocolHeader = X-Forwarded-Proto
# Serve the whole URL space under /admin (NOT /cockpit — that prefix is
# reserved for cockpit's own app URLs and breaks the shell). Direct access
# moves to :9090/admin/ ; the proxy passes the prefix through unstripped.
UrlRoot = /admin
