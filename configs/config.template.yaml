manager:
  launch_commands:
  - echo \"Manager started at $(date)\" >> hello.txt
  - sysctl -w net.core.rmem_max=16777216
  - sysctl -w net.core.wmem_max=16777216
  # - iptables -t nat -C PREROUTING -i eth0 -p udp --dport 20000:30000 -j DNAT --to-destination :36712 2>/dev/null || iptables -t nat -A PREROUTING -i eth0 -p udp --dport 20000:30000 -j DNAT --to-destination :36712
  # - iptables -t nat -C PREROUTING -i eth0 -p udp --dport 6000:19999 -j DNAT --to-destination :5667 2>/dev/null || iptables -t nat -A PREROUTING -i eth0 -p udp --dport 6000:19999 -j DNAT --to-destination :5667
  # - iptables -t nat -C PREROUTING -i eth0 -p udp --dport 3000:5999 -j DNAT --to-destination :5668 2>/dev/null || iptables -t nat -A PREROUTING -i eth0 -p udp --dport 3000:5999 -j DNAT --to-destination :5668
  # - iptables -t nat -C PREROUTING -i eth0 -p udp --dport 1000:2999 -j DNAT --to-destination :5669 2>/dev/null || iptables -t nat -A PREROUTING -i eth0 -p udp --dport 1000:2999 -j DNAT --to-destination :5669
  # - iptables -t nat -C PREROUTING -i eth0 -p udp --dport 53 -j REDIRECT --to-port 8053 2>/dev/null || iptables -t nat -A PREROUTING -i eth0 -p udp --dport 53 -j REDIRECT --to-port 8053
  - echo "starting..."
  - sleep 3
  enable:
  - ws-sr
  - badvpn
  services:
    stunnel: stunnel configs/stunnel.conf
    srapi: ./srapi.py
    telegram_bot: ./bin/telegram_bot
    pystunnel: ./bin/pystunnel
    ws-sr: ./bin/ws-sr -c configs/config.yaml
    dropbear: ./bin/dropbear -EFR -p 127.0.0.1:23 -W 65536 -b /opt/srtunnel/configs/bannerssh
    badvpn: ./bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 1000 --client-socket-sndbuf 0 --udp-mtu 9000
    zivpn: ./bin/udp-zivpn server -c configs/zivpn.json
    udp-custom: ./bin/udp-custom -c configs/udp-custom.json
    hysteria1: ./bin/hysteria1 server --config configs/hysteria1.json
    hysteria2: ./bin/hysteria2 server --config configs/hysteria2.yaml
    slowdns: ./bin/dnstt-server -udp :8053 -privkey-file slowdns.key sd.example.com 127.0.0.1:22
    # udp-rules: iptables -t nat -D PREROUTING -i eth0 -p udp --dport 1:65535 -j DNAT --to-destination :36712
    xray: ./bin/xray run -config /opt/srtunnel/configs/xray.json
    tracker: ./bin/traffic_meter_user
telegram_bot:
  db_file: "users.db"
  config_file: "./configs/zivpn.json"
  default_password: "123"
  token: ""                              # ← put your Telegram bot token here
  primary_url: "http://127.0.0.1:57000"
  domain: "example.com"                  # ← put your main domain here
  cf_root_domain: "example.com"          # ← root domain for DNS management
  cf_token: ""
  cf_zone:  ""
  dnstt: "sd.example.com"
  slowdnskey: "./slowdns.pub"
  interface: "eth0"
  bandwidth_down: "? Mbps"
  bandwidth_up: "? Mbps"
  xray_config: "/opt/srtunnel/configs/xray.json"
  xray_binary: "/opt/srtunnel/bin/xray"
  xray_inbound_tag: "xray-vless"
websocket:
  # WebSocket Tunnel Server Configuration
  # NOTE: plain HTTP only, bound to localhost. nginx owns the public sockets
  # and TLS termination and proxy_passes into the port(s) below.
  # 18081 is the private upstream — never expose it publicly.
  ports: # Port Configuration
    http: [18081]                        # plain-HTTP listener(s) for nginx upstreams
  backend: # Backend Server (SSH, telnet, etc.)
    host: "127.0.0.1"
    port: 22
    max_retries: 3
    retry_delay: 0.5
  server:
    bind_address: "127.0.0.1"
    max_connections: 1000
    buffer_size: 8192
  timeouts:
    initial: 3
    split: 2
    connection: 60
  http:
    response_mode: "auto"
    handle_split: true
    custom_response_text: ""
  performance:
    enable_nodelay: true
  logging:
    level: "INFO"
    format: "detailed"
  monitoring:
    stats_interval: 60
    log_connections: true
    show_bytes_human: true
  errors:
    ignore_early_reset: true
stunnel:
  certfile: server.crt
  keyfile: server.key
  log_level: INFO
  listeners:
    - name: https-main
      listen: 0.0.0.0:443
      default_backend:
        - 127.0.0.1:22
      sni:
        example.com:
          - 127.0.0.1:8081
          - 127.0.0.1:8082
        api.example.com:
          - 127.0.0.1:22
    - name: alt-port
      listen: 0.0.0.0:8443
      default_backend:
        - 127.0.0.1:7000
xui_panel:
  url: "http://127.0.0.1:57001/3x-ui/"
  token: "changeme"
