manager:
  # Units enabled by `srtunnel reconcile`. Commands live in configs/units/*.service.
  enable:
  - srapi
  - ws-sr
  - badvpn
telegram_bot:
  db_file: "users.db"
  config_file: "./configs/zivpn.json"
  default_password: "123"
  token: ""                              # ← put your Telegram bot token here
  primary_url: "http://127.0.0.1:57000"
  domain: "example.com"                  # ← put your main domain here
  cf_root_domain: "example.com"          # ← root domain for DNS management
  cf_token: ""
  cf_zone:  ""
  dnstt: "sd.example.com"
  slowdnskey: "./slowdns.pub"
  interface: "eth0"
  bandwidth_down: "? Mbps"
  bandwidth_up: "? Mbps"
  xray_config: "/opt/srtunnel/configs/xray.json"
  xray_binary: "/opt/srtunnel/bin/xray"
  xray_inbound_tag: "xray-vless"
websocket:
  # WebSocket Tunnel Server Configuration
  # NOTE: plain HTTP only, bound to localhost. nginx owns the public sockets
  # and TLS termination and proxy_passes into the port(s) below.
  # 18081 is the private upstream — never expose it publicly.
  ports: # Port Configuration
    http: [18081]                        # plain-HTTP listener(s) for nginx upstreams
  backend: # Backend Server (SSH, telnet, etc.)
    host: "127.0.0.1"
    port: 22
    max_retries: 3
    retry_delay: 0.5
  server:
    bind_address: "127.0.0.1"
    max_connections: 1000
    buffer_size: 8192
  timeouts:
    initial: 3
    split: 2
    connection: 60
  http:
    response_mode: "auto"
    handle_split: true
    custom_response_text: ""
  performance:
    enable_nodelay: true
  logging:
    level: "INFO"
    format: "detailed"
  monitoring:
    stats_interval: 60
    log_connections: true
    show_bytes_human: true
  errors:
    ignore_early_reset: true
stunnel:
  certfile: server.crt
  keyfile: server.key
  log_level: INFO
  listeners:
    - name: https-main
      listen: 0.0.0.0:443
      default_backend:
        - 127.0.0.1:22
      sni:
        example.com:
          - 127.0.0.1:8081
          - 127.0.0.1:8082
        api.example.com:
          - 127.0.0.1:22
    - name: alt-port
      listen: 0.0.0.0:8443
      default_backend:
        - 127.0.0.1:7000
xui_panel:
  url: "http://127.0.0.1:57001/3x-ui/"
  token: "changeme"
