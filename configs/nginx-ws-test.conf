# ── ws-sr FRONTING TEST (nginx in front, ws-sr behind) ───────────────────────
# One file, two test servers. Install:
#   cp configs/nginx-ws-test.conf /etc/nginx/stream-enabled/ws-test
#   (requires top-level:  stream { include /etc/nginx/stream-enabled/*; } )
# Test with:  plain → 127.0.0.1:18080,  tls → 127.0.0.1:18443
# Both forward to ws-sr's HTTP listener on 127.0.0.1:8080, which fakes the
# "HTTP/1.1 101 / 200" handshake and pipes to sshd. nginx owns the sockets
# and TLS; ws-sr owns the handshake impersonation.

log_format ws_bytes '$remote_addr [$time_local] $protocol $status '
                    '$bytes_sent $bytes_received $session_time';

limit_conn_zone $binary_remote_addr zone=ws_test_ip:10m;

# ── plain TCP test ────────────────────────────────────────────────────────
server {
    listen 18080;
    proxy_pass 127.0.0.1:8080;

    proxy_connect_timeout 5s;
    proxy_timeout 300s;            # idle timeout, mirrors ws-sr max_idle
    proxy_socket_keepalive on;
    tcp_nodelay on;

    limit_conn ws_test_ip 10;      # per-IP cap (ws-sr used a global 1000 cap)
    access_log /var/log/nginx/ws-test-access.log ws_bytes;
}

# ── TLS test ──────────────────────────────────────────────────────────────
server {
    listen 18443 ssl;
    ssl_certificate     /opt/srtunnel/server.crt;
    ssl_certificate_key /opt/srtunnel/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_pass 127.0.0.1:8080;

    proxy_connect_timeout 5s;
    proxy_timeout 300s;
    proxy_socket_keepalive on;
    tcp_nodelay on;

    limit_conn ws_test_ip 10;
    access_log /var/log/nginx/ws-test-access.log ws_bytes;
}
